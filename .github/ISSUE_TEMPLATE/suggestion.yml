name: 💡 Suggestion
description: An idea, a new feature, or a balance change... or a random funny thing.
title: "[Suggestion] "
labels: ["suggestion"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see in the mod?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, or what would it add to the game?

  - type: textarea
    id: extra
    attributes:
      label: Images or examples
      description: Drawings, screenshots, other mods that do something similar...
